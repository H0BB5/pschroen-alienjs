name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      # Packaging validation and the audit drive npm itself, which needs a
      # shell on Windows; the platform-sensitive path logic is already covered
      # by the test suite above.
      - if: runner.os == 'Linux'
        run: npm run pack:check
      - if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high
